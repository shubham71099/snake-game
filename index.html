<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title></title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <main>
            <section>
                <div class="infos">
                    <div class="info">
                        <h3>High Score:
                        <span id="high-score">0</span></h3>
                    </div>
                    <div class="info">
                        <h3>Score:
                        <span id="score">0</span></h3>
                    </div>
                    <div class="info">
                        <h3>Time:
                        <span id="time">00-00</span></h3>
                    </div>
                </div>
                <div class="board"></div>
            </section>
            <div class="modal">
                <div class="start-game">
                    <h3>Welcome to snake game</h3>
                    <button class="btn btn-start">Start Game</button>
                </div>
                 <div class="game-over">
                    <h3>Game Over</h3>
                    <button class="btn btn-restart">Restart Game</button>
                </div>
            </div>
             <footer class="developer-credit">
                Developed by <a href="https://shubhamkumarjha.in/" target="_blank"> Shubham Jha </a>
            </footer>
        </main>
        <script src="script.js"></script>
    </body>
</html>
